<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOIRÉ — Modern Goods</title>

<style>
:root{
  --bg:#f4f4f1;
  --ink:#111;
  --muted:#777;
  --line:#ddd;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,"Noto Sans KR",sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:5;
  background:#f4f4f1ef;
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}

nav{
  height:70px;
  max-width:1150px;
  margin:auto;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:23px;
  font-weight:800;
  letter-spacing:5px;
}

.links{
  display:flex;
  gap:28px;
}

.links a{
  color:#111;
  text-decoration:none;
  font-size:12px;
  letter-spacing:1px;
}

.cartbtn,
.primary{
  background:#111;
  color:#fff;
  border:0;
  border-radius:2px;
  padding:12px 17px;
  cursor:pointer;
}

.hero{
  max-width:1150px;
  margin:auto;
  padding:90px 20px 75px;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:40px;
  align-items:end;
}

.eyebrow{
  font-size:11px;
  letter-spacing:3px;
  color:var(--muted);
  margin-bottom:20px;
}

h1{
  font-size:clamp(60px,9vw,115px);
  line-height:.82;
  letter-spacing:-6px;
  margin:0;
}

.hero p{
  max-width:510px;
  line-height:1.8;
  color:#555;
  margin:28px 0;
}

.heroart{
  height:320px;
  background:linear-gradient(135deg,#111,#666 55%,#ddd);
  position:relative;
  overflow:hidden;
}

.heroart:after{
  content:"NOIRÉ";
  position:absolute;
  right:-20px;
  bottom:20px;
  font-size:75px;
  font-weight:800;
  color:#ffffff20;
  letter-spacing:8px;
}

section{
  max-width:1150px;
  margin:auto;
  padding:30px 20px 85px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:22px;
}

h2{
  margin:0;
  font-size:30px;
}

.count{
  font-size:11px;
  color:#777;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 30px #0001;
}

.pic{
  height:270px;
  background:linear-gradient(135deg,#e8e8e4,#c8c8c4);
  display:grid;
  place-items:center;
  font-size:58px;
  color:#1115;
  position:relative;
}

.tag{
  position:absolute;
  left:13px;
  top:13px;
  background:#111;
  color:#fff;
  padding:6px 9px;
  font-size:9px;
  letter-spacing:1px;
}

.info{
  padding:18px;
}

.cat{
  font-size:10px;
  letter-spacing:2px;
  color:#777;
}

.name{
  font-size:18px;
  margin:7px 0;
}

.price{
  font-weight:bold;
}

.add{
  width:100%;
  margin-top:15px;
  padding:12px;
  background:#fff;
  border:1px solid #111;
  cursor:pointer;
}

.add:hover{
  background:#111;
  color:#fff;
}

.about{
  max-width:none;
  background:#111;
  color:#fff;
  padding:75px max(20px,calc((100% - 1110px)/2));
}

.about p{
  color:#bbb;
  max-width:650px;
  line-height:1.8;
}

footer{
  max-width:1150px;
  margin:auto;
  padding:30px 20px 50px;
  color:#777;
  font-size:12px;
  display:flex;
  justify-content:space-between;
}

.drawer{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
}

.drawer.show{
  display:block;
}

.shade{
  position:absolute;
  inset:0;
  background:#0007;
}

.cart{
  position:absolute;
  right:0;
  top:0;
  width:min(420px,92vw);
  height:100%;
  background:#fff;
  padding:25px;
  display:flex;
  flex-direction:column;
}

.carthead{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #ddd;
  padding-bottom:18px;
}

.close{
  border:0;
  background:none;
  font-size:24px;
  cursor:pointer;
}

.items{
  flex:1;
  overflow:auto;
}

.item{
  padding:16
